name: Publish ChickTV (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chicktv-site"
          cp -- *.html *.css *.js channels.json .nojekyll "$RUNNER_TEMP/chicktv-site/"
          cp -R -- admin assets "$RUNNER_TEMP/chicktv-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/chicktv-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
